name: "Safe Dependabot"
description: "Validate Dependabot configuration against conservative dependency-update policies."
author: "Diogo Ribeiro"
branding:
  icon: "shield"
  color: "green"

inputs:
  config-path:
    description: "Path to the Dependabot configuration file."
    required: false
    default: ".github/dependabot.yml"
  max-open-prs:
    description: "Maximum allowed open Dependabot pull requests per update block."
    required: false
    default: "5"
  require-major-ignore:
    description: "Require routine semver-major version updates to be blocked; security-safe allow rules are preferred."
    required: false
    default: "true"
  require-github-actions:
    description: "Require a github-actions update block."
    required: false
    default: "true"
  fail-on-broad-groups:
    description: "Fail when a dependency group matches every dependency with '*'."
    required: false
    default: "false"
  detect-ecosystems:
    description: "Detect dependency manifests and require matching Dependabot ecosystem and directory coverage."
    required: false
    default: "true"
  detection-ignore-paths:
    description: "Newline-separated repository-relative globs to exclude from ecosystem detection."
    required: false
    default: ""
  detection-overrides:
    description: "Newline-separated glob=ecosystem rules that override automatic manifest classification."
    required: false
    default: ""
  include-ignored-directories:
    description: "Scan normally ignored build/vendor/cache directory names; .git always remains excluded."
    required: false
    default: "false"
  pre-one-risk:
    description: "Pre-1.0 direct dependency policy: off, warn, or fail."
    required: false
    default: "off"

outputs:
  update-blocks:
    description: "Number of Dependabot update blocks validated."
  detected-ecosystems:
    description: "Comma-separated Dependabot ecosystems detected from repository manifests."
  detection-excluded-count:
    description: "Number of manifests excluded by detection-ignore-paths."
  detection-overridden-count:
    description: "Number of manifests reclassified by detection-overrides."
  excluded-manifests:
    description: "Comma-separated repository-relative manifest paths excluded from detection."
  overridden-manifests:
    description: "Comma-separated path=ecosystem detector overrides that were applied."
  pre-one-risk-count:
    description: "Number of exact/resolved direct dependencies found on pre-1.0 versions."
  pre-one-risk-findings:
    description: "Comma-separated ecosystem:dependency@version:manifest pre-1.0 findings."

runs:
  using: "docker"
  image: "Dockerfile"
  args:
    - "--config"
    - "${{ inputs.config-path }}"
    - "--max-open-prs"
    - "${{ inputs.max-open-prs }}"
    - "--require-major-ignore"
    - "${{ inputs.require-major-ignore }}"
    - "--require-github-actions"
    - "${{ inputs.require-github-actions }}"
    - "--fail-on-broad-groups"
    - "${{ inputs.fail-on-broad-groups }}"
    - "--detect-ecosystems"
    - "${{ inputs.detect-ecosystems }}"
    - "--detection-ignore-paths"
    - "${{ inputs.detection-ignore-paths }}"
    - "--detection-overrides"
    - "${{ inputs.detection-overrides }}"
    - "--include-ignored-directories"
    - "${{ inputs.include-ignored-directories }}"
    - "--pre-one-risk"
    - "${{ inputs.pre-one-risk }}"
