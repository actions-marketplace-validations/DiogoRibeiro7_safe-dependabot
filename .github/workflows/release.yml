name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v3.7.0
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate release tag and project version
        shell: bash
        run: |
          set -euo pipefail

          tag="${RELEASE_TAG}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH, got: ${tag}" >&2
            exit 1
          fi

          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          tag_version="${tag#v}"

          if [[ "${project_version}" != "${tag_version}" ]]; then
            echo "pyproject.toml version ${project_version} does not match tag ${tag}" >&2
            exit 1
          fi

      - name: Install validation dependencies
        run: python -m pip install -e ".[dev,docs]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Test
        run: pytest -q

      - name: Build documentation
        run: mkdocs build --strict

      - name: Validate Safe Dependabot itself
        uses: ./

      - name: Move stable major tag
        shell: bash
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#v}"
          major_tag="v${version%%.*}"

          git tag --force "${major_tag}" "${GITHUB_SHA}"
          git push origin "refs/tags/${major_tag}" --force
